# Frontend — https://taskora.digital
# Serves the built Vue app from frontend/dist

server {
    listen 80;
    listen [::]:80;
    server_name taskora.digital www.taskora.digital;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://taskora.digital$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.taskora.digital;

    ssl_certificate     /etc/letsencrypt/live/taskora.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskora.digital/privkey.pem;

    return 301 https://taskora.digital$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name taskora.digital;

    root /var/www/taskora/frontend/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/taskora.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskora.digital/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
